<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portal Jurnal Ilmiah Multi-Kolom Fakultas Teknik Universitas Hasanuddin">
    <title>Portal Jurnal Ilmiah FT-UH - Tugas Mandiri 4</title>
    
    <!-- Integrasi Bootstrap 5 via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" 
        crossorigin="anonymous">

    <link rel="stylesheet" href="./04-tugas-style.css">

<body>
  <header class="main-header shadow-sm">
        <nav class="main-nav">
            <a href="#" class="main-nav__brand">Jurnal Fakultas Teknik Universitas Hasanuddin</a>
            <ul class="main-nav__menu">
                <li><a href="#" class="main-nav__link">Beranda</a></li>
                <li><a href="#" class="main-nav__link">Arsip Jurnal</a></li>
                <li><a href="#" class="main-nav__link">Petunjuk Penulis</a></li>
                <li><a href="#" class="main-nav__link">Kontak</a></li>
            </ul>
        </nav>
    </header>

    <main class="journal-container py-4">
        
        <!-- Kolom Kiri: Sidebar (200px) -->
        <aside class="journal-sidebar">
            <div class="card shadow-sm mb-3 border-0">
                <div class="card-header custom-sidebar-header fw-bold">Departemen</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <a href="#" class="text-decoration-none filter-link active-filter" data-filter="all">Semua Departemen</a>
                    </li>
                    <li class="list-group-item">
                        <a href="#" class="text-decoration-none filter-link inactive-filter" data-filter="informatika">Informatika & Elektro</a>

                    <li class="list-group-item">
                        <a href="#" class="text-decoration-none filter-link inactive-filter" data-filter="sipil">Sipil & Arsitektur</a>
                    </li>
                    <li class="list-group-item">
                        <a href="#" class="text-decoration-none filter-link inactive-filter" data-filter="mesin">Mesin & Industri</a>
                    </li>
                    <li class="list-group-item">
                        <a href="#" class="text-decoration-none filter-link inactive-filter" data-filter="lingkungan">Lingkungan & Energi</a>
                    </li>
                    <li class="list-group-item">
                        <a href="#" class="text-decoration-none filter-link inactive-filter" data-filter="perkapalan">Perkapalan & Kelautan</a>
                    </li>
                </ul>
            </div>
        </aside>

    </main>
