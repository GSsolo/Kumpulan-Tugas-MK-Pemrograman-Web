<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Media dan CSS - Pemutar Media Kuliah</title>
    <link rel="stylesheet" href="03-tugas-style.css">
</head>
<body>
    <article class="card card--featured">
        
        <picture class="card__cover">
            <source media="(min-width: 768px)" srcset="General_Banner_WhatisIOT_4_APAC_2021_11_22_11zon-1.webp" type="image/webp">
            <source media="(max-width: 767px)" srcset="images.webp" type="image/webp">
            <img src="https://dummyimage.com/800x400/0056b3/fff.jpg&text=Ilustrasi+Fallback" alt="Ilustrasi Sampul Materi Kuliah" class="card__image">
        </picture>

        <div class="card__content">
            <h2 class="card__title">Kelas Dasar IoT</h2>
            
            <p class="card__description">
                Pelajari fundamental Internet of Things, mulai dari pengenalan mikrokontroler seperti ESP32, sensor, aktuator, hingga prototyping dasar.
            </p>

            <div class="card__media-group">
                <video class="card__video" controls poster="images.webp">
                    <source src="IoT 101 - The Basics.webm" type="video/webm">
                    <source src="IoT 101 - The Basics.mp4" type="video/mp4">
                    Browser Anda tidak mendukung video.
                </video>

                <audio class="card__audio" controls>
                    <source src="IoT 101 - The Basics.ogg" type="audio/ogg">
                    <source src="IoT 101 - The Basics.mp3" type="audio/mpeg">
                    Browser Anda tidak mendukung audio.
                </audio>
            </div>
        </div>
    </article>
</body>
</html>
